<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F5F1EA" />
  <meta name="color-scheme" content="light" />
  <meta name="author" content="Amaan Khan" />

  <!-- Per-route values are written into a copy of this file for every page at build time
       (staticRoutes in vite.config.ts); react-helmet takes over the data-rh tags at runtime. -->
  <title>Amaan Khan, Service &amp; Product Designer</title>
  <meta name="description" content="Service and product designer trained at the Royal College of Art. I design end-to-end services and build them: research with VISA, BCG and WWT × Airbnb, founding designer at KoinBasket, and products I designed and built myself." data-rh="true" />
  <link rel="canonical" href="https://readmet3xt.github.io/" data-rh="true" />

  <meta property="og:title" content="Amaan Khan, Service &amp; Product Designer" data-rh="true" />
  <meta property="og:description" content="Service and product designer trained at the Royal College of Art. I design end-to-end services and build them: research with VISA, BCG and WWT × Airbnb, founding designer at KoinBasket, and products I designed and built myself." data-rh="true" />
  <meta property="og:type" content="website" data-rh="true" />
  <meta property="og:url" content="https://readmet3xt.github.io/" data-rh="true" />
  <meta property="og:image" content="https://readmet3xt.github.io/social-card.png" data-rh="true" />
  <meta property="og:image:width" content="1200" data-rh="true" />
  <meta property="og:image:height" content="630" data-rh="true" />

  <meta name="twitter:card" content="summary_large_image" data-rh="true" />
  <meta name="twitter:title" content="Amaan Khan, Service &amp; Product Designer" data-rh="true" />
  <meta name="twitter:description" content="Service and product designer trained at the Royal College of Art. I design end-to-end services and build them: research with VISA, BCG and WWT × Airbnb, founding designer at KoinBasket, and products I designed and built myself." data-rh="true" />
  <meta name="twitter:image" content="https://readmet3xt.github.io/social-card.png" data-rh="true" />

  <!-- Two families: Newsreader (headings) + Schibsted Grotesk (text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..600&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
  <!-- Paper on first paint, before the stylesheet arrives -->
  <style>html{background:#F5F1EA;color:#1A1916}</style>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>

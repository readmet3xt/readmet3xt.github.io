<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..600&family=Schibsted+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box;
    background: #F5F1EA; color: #1A1916;
    font-family: 'Schibsted Grotesk', system-ui, sans-serif;
    display: grid; grid-template-columns: 1fr 360px; gap: 64px; align-items: center;
    padding: 72px 80px;
  }
  h1 { font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 92px; line-height: 1; margin: 0; letter-spacing: -0.01em; }
  .role { font-size: 34px; color: #4A453E; margin-top: 18px; }
  .line { font-size: 28px; line-height: 1.4; margin-top: 44px; max-width: 30ch; }
  .url { font-size: 22px; color: #6E675D; margin-top: 40px; }
  img { width: 360px; height: 450px; object-fit: cover; border-radius: 3px; }
</style>
</head>
<body>
  <div>
    <h1>Amaan Khan</h1>
    <div class="role">Service &amp; Product Designer</div>
    <div class="line">I design end-to-end services, and then I build them.</div>
    <div class="url">readmet3xt.github.io</div>
  </div>
  <img src="../public/images/amaan-portrait.webp" alt="">
</body>
</html>

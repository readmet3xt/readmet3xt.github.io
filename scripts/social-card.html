<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box;
    background: #0B0B0C; color: #F2F2F3;
    font-family: 'Geist', system-ui, sans-serif;
    display: grid; grid-template-columns: 1fr 360px; gap: 64px; align-items: center;
    padding: 72px 80px;
  }
  h1 { font-weight: 600; font-size: 96px; line-height: 1.02; margin: 0; letter-spacing: -0.04em; }
  .dot { color: #3E8BFF; }
  .role { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 24px; color: #A3A3A8; margin-top: 26px; }
  .line { font-size: 30px; line-height: 1.35; margin-top: 36px; max-width: 26ch; letter-spacing: -0.01em; }
  .url { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 20px; color: #8D8D92; margin-top: 36px; }
  img { width: 360px; height: 450px; object-fit: cover; border-radius: 18px; }
</style>
</head>
<body>
  <div>
    <h1>hi.<br>i’m amaan<span class="dot">.</span></h1>
    <div class="role">Amaan Khan · Service &amp; Product Designer</div>
    <div class="line">I design end-to-end services, and then I build them.</div>
    <div class="url">readmet3xt.github.io</div>
  </div>
  <img src="../public/images/amaan-portrait.webp" alt="">
</body>
</html>
